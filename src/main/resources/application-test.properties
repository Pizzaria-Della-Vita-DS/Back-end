# Dados de conexao do banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_della_vita?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1973}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Preserva bancos locais existentes que ainda nao possuem historico do Flyway.
spring.flyway.baseline-on-migrate=true
