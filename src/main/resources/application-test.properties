# URL de conexao (o Flyway cria as TABELAS, mas o banco "db_della_vita" precisa já existir)
spring.datasource.url=jdbc:mysql://localhost:3306/db_della_vita

# Credenciais do seu MySQL
spring.datasource.username=root
spring.datasource.password=root

# Hibernate agora só VALIDA se as entidades batem com o schema criado pelo Flyway
# (não cria/recria mais tabelas sozinho)
spring.jpa.hibernate.ddl-auto=validate

# Exibe as consultas SQL geradas no console (util para desenvolvimento)
spring.jpa.show-sql=true