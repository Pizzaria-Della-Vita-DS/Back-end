# URL de conexao (o Flyway cria as TABELAS, mas o banco "db_della_vita" precisa já existir)
spring.datasource.url=jdbc:mysql://localhost:3306/db_della_vita

# Credenciais do seu MySQL
spring.datasource.username=root
spring.datasource.password=1973

# Atualiza a estrutura das tabelas automaticamente com base nas suas classes Java
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas no console (�til para desenvolvimento)
spring.jpa.show-sql=true